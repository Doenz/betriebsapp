name: Supabase Keep-Alive

# Verhindert, dass das Supabase-Projekt nach 7 Tagen Inaktivitaet pausiert wird.
# Laeuft automatisch alle 4 Tage + bei jedem manuellen Anstoss.

on:
  schedule:
    # Jeden Montag und Donnerstag um 06:15 UTC (also etwa 08:15 Schweizer Zeit)
    - cron: '15 6 * * 1,4'
  workflow_dispatch:  # Erlaubt manuelles Ausloesen per Button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          echo "Pinge Supabase an: $(date -u)"
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -H "apikey: sb_publishable_jsQr_GTzKE4jnPEQzEGqmQ_0IQhuTy3" \
            "https://glfcazurctiyxmrvbjdy.supabase.co/rest/v1/betriebsapp_data?select=id&limit=1")
          echo "HTTP-Code: $HTTP_CODE"
          cat /tmp/resp.txt
          # HTTP 401 ist OK — heisst Server antwortet, nur PIN fehlt.
          # HTTP 200 waere mit PIN-Header, aber wir wollen den Secret nicht in Public-Logs.
          # Alles unter 500 ist ein Lebenszeichen.
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "Server-Fehler - Supabase evtl. pausiert?"
            exit 1
          fi
          echo "Supabase antwortet - Projekt bleibt aktiv."
